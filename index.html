  <style>
:root{
  --ink:#22354b;
  --ink-soft:#5e6b7b;
  --primary:#2f5278;
  --primary-strong:#213b60;
  --line:#e4e8eb;
  --orange:#f57f43;
  --yellow:#ffd85f;
  --yellow-wash:#fff5d8;
  --sky:#e9f4ff;
  --paper:#ffffff;
  --page:#f8f7f2;
  --success:#257e52;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);min-height:100vh;color:var(--ink);font-family:Inter,"Avenir Next","Segoe UI",Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#d9e0e7 0.85px,transparent 0.85px);background-size:23px 23px;opacity:.45;z-index:-2}
.ambient{position:fixed;pointer-events:none;border:1px solid #e9ded1;width:370px;height:370px;border-radius:50%;z-index:-1}
.ambient::after{content:"";position:absolute;inset:38px;border:1px dashed #e6dcd0;border-radius:50%}
.ambient-left{left:-200px;top:13%}.ambient-right{right:-220px;bottom:-125px;transform:scale(.9)}
.site{width:min(900px,calc(100% - 40px));margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:28px}
.masthead{background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:19px 19px 0 0;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 27px}
.identity{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:51px;height:51px;object-fit:contain;flex:none;display:block;border-radius:50%}
.identity-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.identity-copy strong{font-weight:850;font-size:19px;letter-spacing:-.06em;line-height:1;color:var(--ink);white-space:nowrap}
.identity-copy strong span{color:#e97739}
.identity-copy small{font-weight:700;font-size:11px;letter-spacing:.015em;color:#7f8790}
.status-group{display:flex;align-items:center;gap:9px;flex:none}
.round-pill,.live-pill{border-radius:99px;padding:8px 11px;font-size:11px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.round-pill{background:#f3f6f8;color:#66778b;border:1px solid #e7edf1}
.live-pill{border:1px solid #d5e9d5;background:#f0f9ec;color:#31754e}
.live-pill i{display:inline-block;width:6px;height:6px;background:#54ae69;border-radius:50%;vertical-align:2px;margin-right:5px}
.live-pill.closed{color:#97723e;background:#fff6e5;border-color:#f4e2bb}.live-pill.closed i{background:#d99c4c}
.app{flex:1}
.panel{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 19px 19px;overflow:hidden;box-shadow:0 18px 38px rgba(39,57,77,.07)}
.intro-grid{display:grid;grid-template-columns:minmax(0,1fr) 238px;align-items:center;gap:16px;padding:35px 42px 27px;min-height:276px;background:linear-gradient(115deg,#fff 0%,#fff 52%,#fff9eb 100%);position:relative}
.intro-grid::before{content:"";position:absolute;right:-35px;top:-70px;width:260px;height:260px;border:1px solid #f1e8d5;border-radius:50%;pointer-events:none}
.intro-copy{z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.115em;text-transform:uppercase;color:#df6d35}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--orange);border-radius:2px;transform:rotate(45deg)}
.intro-copy h1{font-size:clamp(32px,4.8vw,48px);line-height:1.08;margin:12px 0 12px;letter-spacing:-.057em;max-width:545px;font-weight:850}
.intro-copy h1 span{display:block;color:#d97335}
.intro-copy p{font-size:14px;line-height:1.65;color:var(--ink-soft);margin:0;max-width:445px;font-weight:500}
.logo-scene{height:215px;display:grid;place-items:center;position:relative;isolation:isolate}
.logo-halo{width:170px;height:170px;border-radius:50%;background:#ffebba;position:absolute;z-index:-1;box-shadow:0 0 0 17px rgba(255,224,158,.25)}
.hero-brand{width:145px;height:145px;object-fit:contain;filter:drop-shadow(0 9px 7px rgba(112,65,21,.1));z-index:2}
.scene-card{position:absolute;width:90px;height:132px;border:3px solid #3b6195;border-radius:12px;z-index:0;opacity:.62;background:linear-gradient(150deg,#a9cfef,#d5e9fa)}
.scene-card::after{content:"";position:absolute;top:34px;left:21px;width:44px;height:44px;border:5px solid rgba(255,255,255,.84);border-radius:50%}
.scene-card.one{transform:translate(-63px,-5px) rotate(-21deg)}
.scene-card.two{transform:translate(67px,-1px) rotate(19deg);background:#ffd6a3;border-color:#e6a462}
.scene-spark{position:absolute;color:#f3a33b;font-weight:900;font-size:25px}.scene-spark.a{right:7px;top:8px}.scene-spark.b{left:4px;bottom:7px;font-size:19px}
.prize-banner{margin:0 28px;border-radius:13px;background:#fff3d3;border:1px solid #f6e5b4;display:flex;align-items:center;gap:15px;padding:16px 19px}
.prize-symbol{background:#ffd761;width:39px;height:39px;display:grid;place-items:center;border-radius:11px;flex:none;color:#473324}
.prize-symbol svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.prize-copy{display:flex;flex-direction:column;gap:5px}
.prize-copy small{font-size:10px;font-weight:900;color:#a45d26;letter-spacing:.085em}
.prize-copy strong{font-size:15px;line-height:1.4;font-weight:750;color:#3e3f3e}
.start-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:25px 28px 28px}
.primary{border:0;display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:48px;padding:0 23px;background:var(--primary);color:white;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:-.015em;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s}
.primary:hover:not(:disabled){background:var(--primary-strong);transform:translateY(-1px)}
.primary:active:not(:disabled){transform:translateY(0)}
.primary:focus-visible,.option:focus-visible,.back-link:focus-visible{outline:3px solid #e8b243;outline-offset:3px}
.primary:disabled{opacity:.48;cursor:not-allowed}
.primary svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.quickfacts{font-size:11.5px;line-height:1.5;color:#7d8995;font-weight:650;text-align:right}
.quickfacts b{color:#d69b4c;margin:0 7px;font-weight:700}
.footer{display:flex;justify-content:space-between;gap:12px;padding:17px 4px 23px;font-size:10px;font-weight:700;color:#98a0a9;letter-spacing:.01em}
.footer b{color:var(--orange);margin:0 5px}
/* All stages share one quiet, aligned visual hierarchy */
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:24px 30px 17px;border-bottom:1px solid #f0f1f2}
.stage-kicker{font-size:10px;color:#d87a39;font-weight:850;text-transform:uppercase;letter-spacing:.10em}
.stage-head h2{font-size:27px;letter-spacing:-.048em;margin:6px 0 0;line-height:1.15;font-weight:850}
.stage-tag{border:1px solid #dce7ef;background:#f4f8fb;border-radius:99px;padding:8px 12px;white-space:nowrap;font-size:11px;font-weight:800;color:#6f7d89}
.stage-content{padding:23px 30px 29px}
.lead{color:#718093;line-height:1.6;font-size:13px;margin:0 0 21px;max-width:600px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{min-width:0;display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:850;color:#3d4e60}
.field input{min-height:46px;width:100%;min-width:0;border:1px solid #dce4eb;background:#fff;border-radius:9px;font-size:14px;color:var(--ink);outline:none;font-family:inherit;padding:0 13px}
.field input:focus{border-color:#6e9ac7;box-shadow:0 0 0 3px rgba(77,135,184,.13)}
.field input::placeholder{color:#aab2b9}
.field-note{margin:8px 0 0;font-size:11px;color:#94a0aa;line-height:1.5}
.form-error{display:block;color:#a42d3b;background:#fff1f1;padding:10px 12px;border:1px solid #f3d2d4;border-radius:8px;font-size:12px;font-weight:700;margin-top:13px}
.form-actions{display:flex;align-items:center;justify-content:space-between;margin-top:23px;gap:12px}
.back-link{border:0;background:transparent;color:#718095;font-size:12px;font-weight:800;font-family:inherit;padding:10px 0;cursor:pointer}
.back-link:hover{color:var(--primary)}
/* Questions */
.question-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-weight:850;font-size:12px;color:#536a7d}
.timer{padding:7px 11px;background:#f7f8f9;border:1px solid #e1e7ec;color:#56687c;border-radius:99px;font-weight:850;display:flex;gap:6px;align-items:center;min-width:75px;justify-content:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.timer.urgent{background:#fff1f1;border-color:#f2d4d4;color:#bd4646}
.progress{height:5px;background:#eaf0f4;border-radius:20px;overflow:hidden;margin-bottom:23px}
.progress span{display:block;height:100%;background:#f39953;border-radius:20px;transition:width .22s}
.question-title{font-size:clamp(20px,2.8vw,25px);font-weight:800;letter-spacing:-.035em;margin:0 0 23px;line-height:1.32;max-width:750px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.option{font:inherit;font-size:13px;font-weight:650;color:#394d60;background:#fff;border:1px solid #e1e7ed;border-radius:10px;padding:12px 13px;display:flex;gap:10px;min-height:58px;align-items:center;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.option:hover{border-color:#8faeca;background:#f7fafb}
.option.selected{border-color:#3d739b;background:#f0f7fb;box-shadow:0 0 0 1px #3d739b inset}
.option-letter{border-radius:7px;background:#f0f4f7;color:#7790a3;width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900}
.option.selected .option-letter{background:#3d739b;color:#fff}
.question-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.question-note{font-size:11px;color:#8c99a5;font-weight:650;line-height:1.5}
/* Result & closed */
.result-content{text-align:center;padding:27px 22px 32px}
.result-icon{display:inline-grid;place-items:center;width:56px;height:56px;background:#fff2c2;border-radius:50%;color:#a77716;margin-bottom:12px}
.result-icon svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.result-content h2{font-size:27px;font-weight:850;letter-spacing:-.04em;margin:0 0 7px}
.result-content .lead{margin:0 auto 18px;max-width:400px}
.result-number{font-size:45px;font-weight:900;letter-spacing:-.06em;color:#de7e38;line-height:1.08}
.result-number small{font-size:21px;color:#b8a58f;letter-spacing:0}
.result-caption{color:#778696;font-size:12px;font-weight:800;margin:6px 0 20px}
.result-note{margin:0 auto;background:#f7f9fb;color:#657789;font-size:12px;border-radius:9px;padding:11px 15px;max-width:440px;line-height:1.5}
.closed-content{padding:39px 24px 43px;text-align:center}
.closed-content h2{font-size:25px;margin:9px 0;color:var(--ink)}
.closed-content .lead{max-width:440px;margin:0 auto 16px}
.closed-note{display:inline-flex;background:#fff4d5;border:1px solid #fae4b1;border-radius:9px;padding:11px 16px;font-size:12px;font-weight:750;color:#815a33;max-width:460px;line-height:1.5}
@media(max-width:720px){
 .site{width:min(540px,calc(100% - 22px));padding-top:12px}
 .masthead{border-radius:15px 15px 0 0;min-height:70px;padding:11px 15px}
 .brand-logo{width:42px;height:42px}.identity{gap:9px}.identity-copy strong{font-size:15px}.identity-copy small{font-size:10px}
 .status-group{gap:5px}.round-pill{display:none}.live-pill{font-size:10px;padding:7px 9px}
 .panel{border-radius:0 0 15px 15px}
 .intro-grid{padding:26px 20px 14px;grid-template-columns:minmax(0,1fr) 89px;gap:5px;min-height:228px}
 .intro-copy h1{font-size:clamp(25px,7vw,33px);margin:9px 0 9px;line-height:1.1}
 .intro-copy p{font-size:12px;line-height:1.53;max-width:255px}
 .eyebrow{font-size:9px;letter-spacing:.06em}
 .logo-scene{height:132px;align-self:center}.logo-halo{height:89px;width:89px;box-shadow:0 0 0 9px rgba(255,224,158,.3)}
 .hero-brand{width:92px;height:92px}.scene-card{height:78px;width:55px;border-width:2px;border-radius:8px}.scene-card::after{top:19px;left:11px;width:27px;height:27px;border-width:3px}
 .scene-card.one{transform:translate(-26px,-6px) rotate(-22deg)}.scene-card.two{transform:translate(29px,-6px) rotate(19deg)}.scene-spark.a{right:-3px;top:2px;font-size:15px}.scene-spark.b{display:none}
 .prize-banner{margin:2px 15px 0;gap:11px;padding:13px 12px}
 .prize-symbol{width:36px;height:36px;border-radius:9px}.prize-copy small{font-size:9px}.prize-copy strong{font-size:12.5px;line-height:1.38}
 .start-row{padding:16px 15px 20px;display:flex;flex-direction:column;align-items:stretch;gap:11px}
 .primary{min-height:48px;font-size:14px;width:100%}
 .quickfacts{text-align:center;font-size:10.5px;line-height:1.4}
 .footer{flex-direction:column;text-align:center;gap:5px;padding:13px 0 20px;font-size:9px}
 .stage-head{padding:20px 18px 14px}.stage-head h2{font-size:22px}.stage-tag{padding:7px 9px;font-size:10px}
 .stage-content{padding:18px 17px 21px}.lead{font-size:12.5px;margin-bottom:18px}
 .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{font-size:10.5px}.field input{font-size:13px;min-height:44px;padding:0 10px}
 .form-actions{flex-direction:column-reverse;margin-top:17px;gap:8px}.back-link{text-align:center}
 .options{grid-template-columns:1fr;gap:9px}.option{min-height:51px;padding:9px 11px;font-size:13px}
 .question-title{font-size:20px;margin:0 0 17px}.progress{margin-bottom:19px}
 .question-bottom{margin-top:16px;flex-direction:column-reverse;gap:8px}.question-note{text-align:center}
}
@media(max-width:360px){
 .site{width:calc(100% - 14px)}
 .masthead{padding:9px 11px}.brand-logo{width:38px;height:38px}.identity-copy strong{font-size:13px}
 .intro-grid{grid-template-columns:minmax(0,1fr) 78px;padding:23px 14px 13px;min-height:219px}.intro-copy h1{font-size:24px}.intro-copy p{font-size:11.5px}
 .logo-scene{height:113px}.hero-brand{width:78px;height:78px}.logo-halo{width:78px;height:78px}.scene-card{height:70px;width:50px}.scene-card.one{transform:translate(-21px,-5px) rotate(-23deg)}.scene-card.two{transform:translate(22px,-5px) rotate(20deg)}
 .prize-banner{margin:0 11px}.quickfacts{font-size:10px}
 .form-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

</style>

    lock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
  };
  let config={round:1,open:false,seconds:30,points:10,week:1,prize:'1 sobre Pokémon al azar'};
  let state=null,attempt=null,intervalId=null,advancing=false;
  const safe=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label=()=>`Ronda ${String(config.round).padStart(2,'0')}`;
  const key=p=>`heymike_session_${config.round}_${p}`;
  const storage={get:p=>{try{return localStorage.getItem(key(p))||''}catch(_){return ''}},set:(p,t)=>{try{localStorage.setItem(key(p),t)}catch(_){}}};
// La interfaz esta en GitHub Pages; las operaciones privadas se envian a Apps Script.
// POST no-cors evita exponer nombres, ID de Play! y respuestas en la URL.
// El resultado vuelve por una consulta JSONP con un token aleatorio de un solo uso.
const API_URL = 'https://script.google.com/macros/s/AKfycbyqtIaUgnLahYyDQrqGN9bcVDbpQasVJjRjsrgxoEUezGXMJZnJWL1NOJIkCMmXf69b/exec';
const randomId=()=> 'r_'+Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');
const wait=(time)=>new Promise(resolve=>setTimeout(resolve,time));
const inflightKey=(player)=>'heymike_inflight_'+config.round+'_'+player;
function requestJSONP(mode,requestId='') {
  return new Promise((resolve,reject)=>{
    const callback='heyMikeResult'+randomId().slice(2);
    const script=document.createElement('script');
    let done=false;
    const timeout=setTimeout(()=>finish(new Error('La consulta a Google esta tardando demasiado.')),15000);
    function finish(error,data){
      if(done)return;
      done=true;
      clearTimeout(timeout);
      delete window[callback];
      script.remove();
      error?reject(error):resolve(data);
    }
    window[callback]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('No se pudo consultar el servidor de Google.'));
    const url=new URL(API_URL);
    url.searchParams.set('mode',mode);
    url.searchParams.set('callback',callback);
    url.searchParams.set('v',String(Date.now()));
    if(requestId)url.searchParams.set('requestId',requestId);
    script.src=url.href;
    document.head.appendChild(script);
  });
}
async function invokeServer(name,params) {
  if(name==='getPublicStatus'){
    const status=await requestJSONP('status');
    if(!status || status.kind!=='ready')throw new Error('No se pudo cargar el estado de la trivia.');
    if(!status.ok)throw new Error(status.error||'No se pudo consultar la ronda.');
    return status.result;
  }
  if(name!=='joinRound' && name!=='submitAnswer')throw new Error('Accion desconocida.');
  let requestId=randomId();
  // Mantener el mismo ID si un envio anterior pudo haber llegado a Google.
  const pendingKey=name==='joinRound' ? inflightKey(params.playerId) : '';
  try{
    if(pendingKey){
      const old=localStorage.getItem(pendingKey);
      if(old && /^r_[a-f0-9]{32}$/.test(old))requestId=old;
      else localStorage.setItem(pendingKey,requestId);
    }
  }catch(_){}
  let sendError=null;
  try {
    const body=new URLSearchParams({requestId,action:name,payload:JSON.stringify(params)});
    await fetch(API_URL,{method:'POST',mode:'no-cors',body:body,cache:'no-store'});
  }catch(error){sendError=error;}
  // Un POST no-cors no permite leer la respuesta. Solo consultamos su resultado
  // mediante un ID aleatorio que no incluye datos personales.
  for(let i=0;i<17;i++){
    await wait(i<3?1100:2100);
    try{
      const reply=await requestJSONP('poll',requestId);
      if(!reply || reply.kind!=='ready')continue;
      if(!reply.ok)throw new Error(reply.error||'No se pudo guardar.');
      if(pendingKey){try{localStorage.removeItem(pendingKey)}catch(_){}}
      return reply.result;
    }catch(error){
      // Errores de servidor = definitivos; errores temporales de consulta = reintentar.
      if(error && error.message && !/No se pudo consultar|tardando demasiado/i.test(error.message))throw error;
    }
  }
  throw new Error(sendError ? 'No se pudo conectar con Google. Comprueba tu conexion e intentalo otra vez.' :
    'Google no confirmo la operacion. Vuelve a intentar desde este mismo dispositivo, sin borrar los datos del navegador.');
}
function call(name,params,onSuccess,onFailure){
  invokeServer(name,params).then(onSuccess).catch(onFailure);
}
  function stopTimer(){if(intervalId!==null){clearInterval(intervalId);intervalId=null;}}
  function setView(html){stopTimer();app.innerHTML=html;}
  function button(text,id,attr=''){return `<button type="button" class="primary" id="${id}" ${attr}>${text} ${icons.arrow}</button>`;}
  function head(kicker,title,tag){return `<div class="stage-head"><div><div class="stage-kicker">${kicker}</div><h2>${title}</h2></div><span class="stage-tag">${safe(tag)}</span></div>`;}
  function updateBadge(){roundLabel.textContent=label();liveStatus.innerHTML=config.open?'<i></i> Disponible':'<i></i> No disponible';liveStatus.classList.toggle('closed',!config.open);}
  function errorMessage(e){return e&&e.message?String(e.message):'Ocurrió un problema de conexión. Intenta nuevamente.';}
  function busy(text='Conectando con la trivia...'){setView(`<section class="panel"><div class="closed-content"><h2>${safe(text)}</h2><p class="lead">Espera un momento.</p></div></section>`);}
  function init(){
    busy('Cargando la ronda');
    call('getPublicStatus',null,data=>{config=data;updateBadge();config.open?landing():closed();}, e=>showConnectionError(e));
  }
  function showConnectionError(error){setView(`<section class="panel"><div class="closed-content"><div class="result-icon">${icons.lock}</div><h2>No se pudo conectar</h2><p class="lead">${safe(errorMessage(error))}</p>${button('Volver a intentar','retryBtn')}</div></section>`);document.querySelector('#retryBtn').addEventListener('click',init);}
  function landing(){
    if(!config.open)return closed();
    state=null;attempt=null;
    setView(`<section class="panel">
      <div class="intro-grid">
        <div class="intro-copy">
          <span class="eyebrow">HEY MIKE! · RETO SEMANAL</span>
          <h1>¿Cuánto sabes de <span>Pokémon TCG?</span></h1>
          <p>Responde 5 preguntas cada día y acumula puntos para llegar a lo más alto de la clasificación.</p>
        </div>
        <div class="logo-scene" aria-hidden="true">
          <span class="logo-halo"></span><span class="scene-card one"></span><span class="scene-card two"></span>
          <img class="hero-brand" src="${brandLogoSrc}" alt=""><span class="scene-spark a">✦</span><span class="scene-spark b">✦</span>
        </div>
      </div>
      <div class="prize-banner"><span class="prize-symbol">${icons.trophy}</span>
        <div class="prize-copy"><small>PREMIO · SEMANA ${safe(config.week)}</small>
        <strong>El ganador se llevará ${safe(config.prize)}.</strong></div>
      </div>
      <div class="start-row">${button('Iniciar preguntas','startBtn')}
        <span class="quickfacts">5 preguntas <b>·</b> ${Number(config.seconds)} s por pregunta <b>·</b> ${Number(config.points)} puntos por acierto</span>
      </div>
    </section>`);
    document.querySelector('#startBtn').addEventListener('click',registration);
  }
  function registration(){
    if(!config.open)return closed();
    setView(`<section class="panel">${head('ANTES DE JUGAR','Tus datos de participación',label())}
      <div class="stage-content"><p class="lead">Completa tus datos antes de empezar. Tu ID de Play! Pokémon identificará tu participación en cada ronda.</p>
      <form id="registrationForm" novalidate><div class="form-grid">
        <div class="field"><label for="firstName">Nombre</label><input type="text" id="firstName" placeholder="Tu nombre" maxlength="50" autocomplete="given-name" required></div>
        <div class="field"><label for="lastName">Apellido</label><input type="text" id="lastName" placeholder="Tu apellido" maxlength="60" autocomplete="family-name" required></div>
        <div class="field full"><label for="playerId">ID de jugador de Play! Pokémon</label><input type="text" id="playerId" inputmode="numeric" placeholder="Ej. 1234567" maxlength="12" autocomplete="off" required><p class="field-hint">Tu ID permite registrar tus puntos y evita que vuelvas a empezar la misma ronda.</p></div>
      </div><p class="form-error" id="formError" role="alert" hidden></p>
      <div class="form-actions"><button type="button" id="backBtn" class="back-link">← Volver al inicio</button><button type="submit" id="joinBtn" class="primary">Jugar ahora ${icons.arrow}</button></div>
      </form></div></section>`);
    document.querySelector('#backBtn').addEventListener('click',landing);
    document.querySelector('#registrationForm').addEventListener('submit',start);
  }
  function start(e){
    e.preventDefault();
    const firstName=document.querySelector('#firstName').value.trim().replace(/\s+/g,' ');
    const lastName=document.querySelector('#lastName').value.trim().replace(/\s+/g,' ');
    const playerId=document.querySelector('#playerId').value.trim();
    const err=document.querySelector('#formError'),btn=document.querySelector('#joinBtn');
    if(firstName.length<2||lastName.length<2){err.hidden=false;err.textContent='Ingresa tu nombre y apellido.';return;}
    if(!/^\d{5,12}$/.test(playerId)){err.hidden=false;err.textContent='El ID debe tener de 5 a 12 dígitos.';return;}
    err.hidden=true;btn.disabled=true;btn.textContent='Verificando tu ID...';
    attempt={firstName,lastName,playerId,token:storage.get(playerId)};
    call('joinRound',{firstName,lastName,playerId,token:attempt.token}, data=>showState(data,true), e=>{
      err.hidden=false;err.textContent=errorMessage(e);btn.disabled=false;btn.innerHTML=`Jugar ahora ${icons.arrow}`;
    });
  }
  function showState(data,fromJoin=false){
    if(!data){showConnectionError(new Error('No se recibió respuesta del servidor.'));return;}
    state=data;
    if(data.token && attempt){attempt.token=data.token;storage.set(attempt.playerId,data.token);}
    if(data.kind==='finished'){return result(Boolean(fromJoin));}
    if(data.kind==='question'){return question();}
    showConnectionError(new Error('No se pudo recuperar la participación.'));
  }
  function question(){
    if(!state||state.kind!=='question')return landing();
    advancing=false;
    const n=state.index;
    const q=state.question;
    const options=q.options.map((v,i)=>`<button type="button" class="option" data-answer="${i}" aria-pressed="false"><span class="option-letter">${'ABCD'[i]}</span><span>${safe(v)}</span></button>`).join('');
    setView(`<section class="panel">
      ${head('PON A PRUEBA TUS CONOCIMIENTOS','¡Vamos con la trivia!',label())}
      <div class="stage-content">
        <div class="question-meta"><span>PREGUNTA ${n+1} DE ${state.total}</span><span class="timer" id="timeBox">${icons.clock}<span id="seconds">${state.seconds} s</span></span></div>
        <div class="progress"><span style="width:${Math.round(n/state.total*100)}%"></span></div>
        <h3 class="question-title">${safe(q.text)}</h3>
        <div class="options" role="group" aria-label="Elige una alternativa">${options}</div>
        <div class="question-bottom"><span class="question-note" id="questionNote">Elige una alternativa para continuar.</span>${button(n===state.total-1?'Finalizar':'Continuar','nextBtn','disabled')}</div>
      </div></section>`);
    let selected=null;
    document.querySelectorAll('[data-answer]').forEach(o=>o.addEventListener('click',()=>{
      if(advancing)return;
      selected=Number(o.dataset.answer);
      document.querySelectorAll('[data-answer]').forEach(b=>{
        const active=Number(b.dataset.answer)===selected;
        b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active));
      });
      document.querySelector('#nextBtn').disabled=false;
      document.querySelector('#questionNote').textContent='Respuesta seleccionada.';
    }));
    document.querySelector('#nextBtn').addEventListener('click',()=>{if(selected!==null)advance(selected);});
    // Reloj visual solamente. El servidor verifica realmente los 30 segundos.
    let remainingOnArrival=Math.max(0,Number(state.deadlineMs)-Number(state.serverNowMs));
    const localDeadline=Date.now()+remainingOnArrival;
    function tick(){
      if(advancing)return;
      const seconds=Math.max(0,Math.ceil((localDeadline-Date.now())/1000));
      const el=document.querySelector('#seconds');if(el)el.textContent=`${seconds} s`;
      const pill=document.querySelector('#timeBox');if(pill)pill.classList.toggle('urgent',seconds<=8);
      if(seconds<=0)advance(-1);
    }
    tick(); if(!advancing)intervalId=setInterval(tick,200);
  }
  function advance(choice){
    if(advancing||!state||state.kind!=='question'||!attempt)return;
    advancing=true;stopTimer();
    const index=state.index;
    const btn=document.querySelector('#nextBtn');
    if(btn){btn.disabled=true;btn.textContent='Guardando respuesta...';}
    call('submitAnswer',{round:config.round,playerId:attempt.playerId,token:attempt.token,index,choice},
      data=>showState(data),e=>{
        advancing=false;
        const note=document.querySelector('#questionNote');if(note)note.textContent='No se pudo guardar. Reintenta para continuar.';
        if(btn){btn.disabled=false;btn.innerHTML=`Reintentar ${icons.arrow}`;btn.onclick=()=>advance(choice);}
      });
  }
  function result(previous){
    const points=Number(state.points)||0;
    const correct=Number(state.correct)||0;
    setView(`<section class="panel">${head('RONDA TERMINADA','Tu resultado',label())}
      <div class="result-content"><div class="result-icon">${icons.check}</div>
        <h2>${previous?'Ya participaste en esta ronda':`¡Bien jugado, ${safe(attempt?.firstName||state.firstName||'')}!`}</h2>
        <p class="lead">${previous?'Tu participación ya quedó registrada en Google Sheets.':'Has completado las cinco preguntas. Tus puntos fueron guardados automáticamente.'}</p>
        <div class="result-number">${points}<small> / ${state.total*Number(config.points)}</small></div>
        <div class="result-caption">${correct} de ${state.total} respuestas correctas</div>
        <p class="result-note">Vuelve para la siguiente ronda y sigue sumando puntos para competir por el premio de la semana ${safe(config.week)}.</p>
      </div></section>`);
  }
  function closed(){
    setView(`<section class="panel">${head('TRIVIA POKÉMON TCG','Siguiente ronda',label())}
      <div class="closed-content"><div class="result-icon">${icons.lock}</div>
        <h2>La trivia aún no está abierta</h2>
        <p class="lead">La siguiente tanda de cinco preguntas estará disponible cuando el organizador la active.</p>
        <div class="closed-note">Premio de la semana ${safe(config.week)}: ${safe(config.prize)} para quien acumule más puntos.</div>
        <div style="margin-top:16px">${button('Actualizar','reloadBtn')}</div>
      </div></section>`);
    document.querySelector('#reloadBtn').addEventListener('click',init);
  }
  init();
})();


</script>
